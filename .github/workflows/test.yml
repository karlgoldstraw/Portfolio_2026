name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run already in flight redundant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Playwright does not fetch browsers when it is installed, so the one the
      # tests drive has to be asked for.
      - run: npx playwright install --with-deps chromium
      - run: npm test
