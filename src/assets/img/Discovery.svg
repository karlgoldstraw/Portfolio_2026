<?xml version="1.0" encoding="UTF-8"?>
<svg width="840px" height="660px" viewBox="0 0 840 660" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <title>Accessibility discovery</title>
    <desc>The universal access symbol: a figure with arms and legs outstretched inside a circle.</desc>
    <defs>
        <radialGradient cx="50%" cy="50%" fx="50%" fy="50%" r="74.2971721%" gradientTransform="translate(0.500000,0.500000),scale(0.785714,1.000000),rotate(90.000000),translate(-0.500000,-0.500000)" id="radialGradient-1">
            <stop stop-color="#F7F7F7" offset="0%"></stop>
            <stop stop-color="#E2E2E2" offset="100%"></stop>
        </radialGradient>
    </defs>
    <g id="Accessibility-discovery" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <rect fill="#E5E5E5" x="0" y="0" width="840" height="660"></rect>
        <rect fill="url(#radialGradient-1)" x="0" y="0" width="840" height="660"></rect>
        <g id="Symbol" transform="translate(420, 330) scale(0.7)">
            <circle id="Ring" stroke="#6B6B6B" stroke-width="24" cx="0" cy="0" r="172"></circle>
            <circle id="Head" fill="#6B6B6B" cx="0" cy="-100" r="30"></circle>
            <g id="Body" stroke="#6B6B6B" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
                <polyline id="Arms" points="-100,-28 0,-46 100,-28"></polyline>
                <line id="Torso" x1="0" y1="-46" x2="0" y2="44"></line>
                <line id="Left-leg" x1="0" y1="44" x2="-50" y2="124"></line>
                <line id="Right-leg" x1="0" y1="44" x2="50" y2="124"></line>
            </g>
        </g>
    </g>
</svg>
